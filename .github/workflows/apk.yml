name: APK Android

# Compila "Il Cammino di Bruno" come app Android e la pubblica nella release "apk".
on:
  push:
    paths:
      - 'cammino-di-bruno.html'
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copia il gioco nell'app
        run: |
          mkdir -p android/app/src/main/assets
          cp cammino-di-bruno.html android/app/src/main/assets/index.html

      - name: Compila l'APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepara il file
        run: cp android/app/build/outputs/apk/release/app-release.apk cammino-di-bruno.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cammino-di-bruno-apk
          path: cammino-di-bruno.apk

      - name: Pubblica APK e HTML nella release "apk"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Il Cammino di Bruno. Android: apri questa pagina con Chrome, tocca cammino-di-bruno.apk, conferma il download, poi apri il file e consenti l'installazione da origini sconosciute. Computer o telefono, anche offline: scarica cammino-di-bruno.html e aprilo con il browser. Versione del commit ${GITHUB_SHA::7}."
          if ! gh release view apk >/dev/null 2>&1; then
            gh release create apk cammino-di-bruno.apk cammino-di-bruno.html --target "${GITHUB_SHA}" --title "Il Cammino di Bruno" --notes "$NOTES"
            exit 0
          fi
          # La release resta sempre online: ogni file nuovo si carica con un nome temporaneo,
          # poi si toglie il vecchio e si rinomina il nuovo (buco di una frazione di secondo).
          swap() {
            name="$1"; tmp="nuovo-$1"; cp "$name" "$tmp"
            gh release upload apk "$tmp" --clobber
            ids=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/apk" --jq '.assets[] | "\(.name) \(.id)"')
            old_id=$(echo "$ids" | awk -v n="$name" '$1==n{print $2}')
            new_id=$(echo "$ids" | awk -v n="$tmp" '$1==n{print $2}')
            if [ -n "$old_id" ]; then gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${old_id}"; fi
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${new_id}" -f name="$name" >/dev/null
          }
          swap cammino-di-bruno.apk
          swap cammino-di-bruno.html
          gh release edit apk --title "Il Cammino di Bruno" --notes "$NOTES"
