<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Petalini</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: mondo a quadretti a tutto schermo; l'interfaccia è fatta di cartoncini color carta con bordo d'inchiostro prugna. */
:root {
  --ink: #2b2238;          /* inchiostro prugna: testo e bordi */
  --paper: #fffaf0;        /* carta dei fumetti e dei menù */
  --paper-2: #f3ead8;
  --petal: #ff6f9f;        /* azione principale */
  --petal-soft: #ffe1ea;
  --petal-deep: #c9406f;
  --leaf: #3f9a35;
  --sun: #ffc93c;
  --forest: #3e8a3a;
  --font-display: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --ui-h: 220px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--forest); color: var(--ink); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: auto; }

/* ---------- Titolo ---------- */
#title { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); background: radial-gradient(ellipse at 50% 45%, rgba(255, 248, 225, .30), rgba(24, 44, 22, .55)); }
.title-card { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; max-width: 520px; }
.logo { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(60px, 15vw, 120px); line-height: .9; letter-spacing: .01em; display: flex; }
.logo span { display: inline-block; color: var(--sun); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 var(--ink); animation: hop 2.6s ease-in-out infinite; }
.logo span:nth-child(even) { color: var(--petal); }
.logo span:nth-child(1) { animation-delay: 0s; transform: rotate(-6deg); }
.logo span:nth-child(2) { animation-delay: .12s; }
.logo span:nth-child(3) { animation-delay: .24s; }
.logo span:nth-child(4) { animation-delay: .36s; }
.logo span:nth-child(5) { animation-delay: .48s; }
.logo span:nth-child(6) { animation-delay: .60s; }
.logo span:nth-child(7) { animation-delay: .72s; }
.logo span:nth-child(8) { animation-delay: .84s; }
@keyframes hop { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(-10px); } }
.tagline { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(17px, 4vw, 21px); color: #fff; text-shadow: 0 2px 0 var(--ink), 0 0 12px rgba(0,0,0,.35); text-wrap: balance; }
.title-btns { display: flex; flex-direction: column; gap: 10px; width: min(320px, 100%); }
.tbtn { min-height: 54px; border: 3px solid var(--ink); border-radius: 16px; background: var(--paper); font-family: var(--font-display); font-weight: 600; font-size: 20px; box-shadow: 0 5px 0 var(--ink); transition: transform .08s; }
.tbtn.primary { background: var(--petal); color: #fff; }
.tbtn.focus, .tbtn:hover { transform: translateY(-2px); outline: 3px solid var(--sun); outline-offset: 2px; }
.tbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.keys-hint { margin: 0; font-size: 14px; font-weight: 700; color: #fff; text-shadow: 0 1px 0 var(--ink); max-width: 36ch; line-height: 1.45; }

/* ---------- HUD del mondo ---------- */
#hud { position: fixed; z-index: 15; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
#goal { background: rgba(255, 250, 240, .93); border: 2.5px solid var(--ink); border-radius: 12px; padding: 6px 11px 7px; font-weight: 800; font-size: 14px; line-height: 1.25; max-width: min(62vw, 340px); box-shadow: 0 3px 0 rgba(43,34,56,.25); }
#goal small { display: block; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--petal-deep); }
.hud-btns { display: flex; gap: 8px; }
.hudbtn { pointer-events: auto; min-width: 46px; height: 46px; padding: 0 12px; border: 2.5px solid var(--ink); border-radius: 12px; background: var(--paper); font-family: var(--font-display); font-weight: 600; font-size: 16px; box-shadow: 0 3px 0 rgba(43,34,56,.3); }
.hudbtn:active { transform: translateY(2px); }

/* ---------- Fumetto ---------- */
#dialog { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(720px, calc(100% - 24px)); min-height: 92px; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 rgba(43,34,56,.3); padding: 16px 40px 16px 18px; font-size: clamp(16px, 2.3vw, 19px); line-height: 1.45; font-weight: 700; cursor: pointer; }
#dlgWho { position: absolute; top: -17px; left: 14px; background: var(--petal); color: #fff; border: 3px solid var(--ink); border-radius: 10px; padding: 0 10px 1px; font-family: var(--font-display); font-weight: 600; font-size: 15px; }
#dialog .more { position: absolute; right: 14px; bottom: 10px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 10px solid var(--petal-deep); opacity: 0; }
#dialog.ready .more { opacity: 1; animation: nudge .8s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(4px); } }
body.touch[data-mode="world"] #dialog { bottom: calc(184px + env(safe-area-inset-bottom, 0px)); }
body[data-mode="battle"] #dialog, body[data-mode="evolve"] #dialog { left: 0; transform: none; bottom: 0; width: 100%; height: var(--ui-h); border-width: 3px 0 0; border-radius: 20px 20px 0 0; padding: 20px max(44px, calc(env(safe-area-inset-right, 0px) + 28px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); font-size: clamp(17px, 2.5vw, 21px); }
body[data-mode="battle"] #dialog .more { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); }

/* ---------- Scelte ---------- */
#choices { position: fixed; z-index: 45; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 24px)); max-height: min(80vh, 660px); overflow-y: auto; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 rgba(43,34,56,.3); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
body[data-mode="battle"] #choices { left: 0; transform: none; bottom: 0; width: 100%; min-height: var(--ui-h); max-height: 72vh; border-width: 3px 0 0; border-radius: 20px 20px 0 0; padding: 12px max(14px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
body[data-mode="battle"] #choices .opts { max-width: 760px; width: 100%; margin: 0 auto; }
body[data-mode="battle"] #choices .prompt { max-width: 760px; width: 100%; margin: 0 auto; }
.prompt { font-family: var(--font-display); font-weight: 600; font-size: 19px; padding: 2px 4px; text-wrap: balance; }
.opts { display: grid; gap: 8px; grid-template-columns: 1fr; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 7px 12px; border: 2.5px solid var(--ink); border-radius: 12px; background: #fff; font-family: var(--font-body); font-weight: 800; font-size: 16px; text-align: left; min-width: 0; }
.opt .txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.opt .lbl { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.15; }
.opt .sub { font-size: 13px; font-weight: 700; opacity: .72; line-height: 1.25; }
.opt canvas { flex: none; }
.opt.focus { background: var(--petal-soft); box-shadow: inset 0 0 0 2px var(--petal); }
.opt.disabled { opacity: .45; }
.opt.cancel { justify-content: center; background: var(--paper-2); min-height: 44px; grid-column: 1 / -1; }
.opt.cancel.focus { background: var(--petal-soft); }
.chip { flex: none; font-family: var(--font-body); font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: #fff; padding: 2px 8px 3px; border-radius: 999px; }

/* ---------- Schede della lotta ---------- */
.card { position: fixed; z-index: 20; width: min(270px, 56vw); background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 8px 12px 10px; box-shadow: 0 4px 0 rgba(43,34,56,.3); }
#foeCard { top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); }
#meCard { right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(var(--ui-h) + 14px); }
.card .row { display: flex; align-items: center; gap: 8px; }
.card .nm { font-family: var(--font-display); font-weight: 600; font-size: 18px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .lv { font-family: var(--font-display); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 11px; margin-top: 6px; border: 2px solid var(--ink); border-radius: 6px; background: #e9e0d0; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 100%; background: #46c05a; }
.bar.xp { height: 7px; margin-top: 5px; }
.bar.xp > i { background: #4a9dff; transition: width .5s; }
.hpnum { margin-top: 2px; text-align: right; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.hplbl { position: absolute; left: 0; top: -1px; font-size: 0; }

/* ---------- Pannelli (scheda, erbario) ---------- */
#panel { position: fixed; inset: 0; z-index: 46; display: grid; place-items: center; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); background: rgba(30, 22, 40, .45); }
.pinner { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 rgba(43,34,56,.35); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.pinner h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 26px; text-wrap: balance; }
.pinner p { margin: 0; line-height: 1.5; font-weight: 700; }
.pinner .muted { opacity: .7; font-size: 14px; }
.info-head { display: flex; gap: 14px; align-items: center; }
.info-head .meta { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stat { background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 6px 4px; text-align: center; }
.stat small { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; opacity: .7; }
.stat b { font-family: var(--font-display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.movelist { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mv { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 6px 8px; font-weight: 800; font-size: 14px; min-width: 0; }
.dexgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.dex { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px 8px; background: #fff; border: 2px solid var(--ink); border-radius: 12px; font-weight: 800; font-size: 13px; text-align: center; }
.dex .no { font-size: 10.5px; opacity: .6; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.dex.unk { background: var(--paper-2); }
.dex.sel { box-shadow: inset 0 0 0 2px var(--petal); background: var(--petal-soft); }
.dexinfo { min-height: 64px; background: #fff; border: 2px dashed var(--ink); border-radius: 12px; padding: 10px 12px; font-weight: 700; line-height: 1.45; }

/* ---------- Comandi touch ---------- */
#pad { display: none; }
body.touch[data-mode="world"] #pad { display: block; }
#dpad { position: fixed; z-index: 25; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 156px; height: 156px; }
#dpad button, #ab button { position: absolute; touch-action: none; border: 3px solid var(--ink); background: rgba(255, 250, 240, .9); font-family: var(--font-display); font-weight: 700; box-shadow: 0 4px 0 rgba(43,34,56,.35); }
#dpad button { width: 54px; height: 54px; border-radius: 14px; font-size: 18px; }
#dpad .u { left: 51px; top: 0; } #dpad .d { left: 51px; bottom: 0; } #dpad .l { left: 0; top: 51px; } #dpad .r { right: 0; top: 51px; }
#dpad button.on, #ab button.on { transform: translateY(3px); box-shadow: 0 1px 0 rgba(43,34,56,.35); background: var(--petal-soft); }
#ab { position: fixed; z-index: 25; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); width: 150px; height: 124px; }
#ab #btnA { right: 0; top: 0; width: 74px; height: 74px; border-radius: 50%; background: var(--petal); color: #fff; font-size: 26px; }
#ab #btnA.on { background: var(--petal-deep); }
#ab #btnB { left: 0; bottom: 0; width: 60px; height: 60px; border-radius: 50%; font-size: 20px; }

#fade { position: fixed; inset: 0; z-index: 50; background: #1d1630; opacity: 0; pointer-events: none; transition: opacity .3s; }
#fade.on { opacity: 1; }
#flash { position: fixed; inset: 0; z-index: 51; background: #fff; opacity: 0; pointer-events: none; }
#flash.go { animation: flash .75s steps(1) forwards; }
@keyframes flash { 0% { opacity: 1; } 14% { opacity: 0; } 28% { opacity: 1; } 42% { opacity: 0; } 56% { opacity: 1; } 70% { opacity: 0; background: #1d1630; } 71% { opacity: 1; background: #1d1630; } 100% { opacity: 1; background: #1d1630; } }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .logo span, #dialog.ready .more { animation: none; } }
</style>
</head>
<body data-mode="title">
<canvas id="game"></canvas>

<div id="title">
  <div class="title-card">
    <h1 class="logo" aria-label="Petalini"><span>P</span><span>e</span><span>t</span><span>a</span><span>l</span><span>i</span><span>n</span><span>i</span></h1>
    <p class="tagline">Cattura, allena e fai amicizia con le creature del Bosco dei Fiori</p>
    <div class="title-btns">
      <button class="tbtn primary" id="btnCont" hidden>Continua</button>
      <button class="tbtn" id="btnNew">Nuova avventura</button>
    </div>
    <p class="keys-hint" id="keysHint">Frecce o WASD per camminare · Invio o Z per parlare e confermare · Esc o X per il menù</p>
  </div>
</div>

<div id="hud" hidden>
  <div id="goal"><small>Obiettivo</small><span id="goalText"></span></div>
  <div class="hud-btns">
    <button class="hudbtn" id="btnSound" aria-label="Suono">♪</button>
    <button class="hudbtn" id="btnMenu">Menu</button>
  </div>
</div>

<div id="foeCard" class="card" hidden>
  <div class="row"><span class="nm"></span><span class="chip"></span><span class="lv"></span></div>
  <div class="bar hp"><i></i></div>
</div>
<div id="meCard" class="card" hidden>
  <div class="row"><span class="nm"></span><span class="chip"></span><span class="lv"></span></div>
  <div class="bar hp"><i></i></div>
  <div class="hpnum"></div>
  <div class="bar xp"><i></i></div>
</div>

<div id="dialog" hidden><span id="dlgWho" hidden></span><span id="dlgText"></span><span class="more"></span></div>
<div id="choices" hidden></div>
<div id="panel" hidden></div>

<div id="pad">
  <div id="dpad">
    <button class="u" data-d="up" aria-label="Su">▲</button>
    <button class="l" data-d="left" aria-label="Sinistra">◀</button>
    <button class="r" data-d="right" aria-label="Destra">▶</button>
    <button class="d" data-d="down" aria-label="Giù">▼</button>
  </div>
  <div id="ab">
    <button id="btnA" aria-label="A: parla e conferma">A</button>
    <button id="btnB" aria-label="B: menù e indietro">B</button>
  </div>
</div>
<div id="fade"></div>
<div id="flash"></div>

<script>
'use strict';
/* =====================================================================
   PETALINI — un piccolo gioco di cattura e lotta a turni.
   Tutto in un file: mappa, creature disegnate a mano col canvas,
   lotte, Erbario, salvataggio e musica sintetizzata.
   ===================================================================== */

// ---------- Utilità ----------
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = Math.random;
const pick = a => a[Math.floor(rnd() * a.length)];
const randInt = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const wait = ms => new Promise(r => setTimeout(r, ms));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function hash(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
const DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };

// ---------- Tipi ----------
const TYPES = {
  Normale: '#8f8577', Erba: '#3f9a35', Fuoco: '#e0582a',
  Acqua: '#2f84cf', Vento: '#3f98bb', Roccia: '#9a7643',
};
const EFF = {
  Fuoco: { Erba: 2, Acqua: .5, Roccia: .5, Fuoco: .5 },
  Acqua: { Fuoco: 2, Roccia: 2, Erba: .5, Acqua: .5 },
  Erba: { Acqua: 2, Roccia: 2, Fuoco: .5, Vento: .5, Erba: .5 },
  Vento: { Erba: 2, Roccia: .5 },
  Roccia: { Fuoco: 2, Vento: 2, Erba: .5 },
};
const eff = (a, d) => (EFF[a] && EFF[a][d]) || 1;

// ---------- Mosse ----------
const MOVES = {
  spintone: { n: 'Spintone', t: 'Normale', p: 40, a: 100 },
  graffio: { n: 'Graffietto', t: 'Normale', p: 40, a: 100 },
  pizzico: { n: 'Pizzicotto', t: 'Normale', p: 50, a: 95 },
  morso: { n: 'Morsetto', t: 'Normale', p: 60, a: 95 },
  broncio: { n: 'Broncio', t: 'Normale', p: 0, a: 100, fx: ['foe', 'atk', -1] },
  sguardo: { n: 'Sguardo Fisso', t: 'Normale', p: 0, a: 100, fx: ['foe', 'def', -1] },
  polline: { n: 'Polline Appiccicoso', t: 'Erba', p: 0, a: 95, fx: ['foe', 'spd', -1] },
  guscio: { n: 'Guscio', t: 'Normale', p: 0, a: 100, fx: ['self', 'def', 1] },
  foglia: { n: 'Foglia Tagliente', t: 'Erba', p: 45, a: 100 },
  frusta: { n: 'Frusta di Liana', t: 'Erba', p: 65, a: 100 },
  fotosintesi: { n: 'Fotosintesi', t: 'Erba', p: 0, a: 100, heal: .5 },
  tempesta: { n: 'Tempesta di Petali', t: 'Erba', p: 90, a: 90 },
  scintilla: { n: 'Scintilla', t: 'Fuoco', p: 45, a: 100 },
  fiammata: { n: 'Fiammata', t: 'Fuoco', p: 65, a: 100 },
  vampata: { n: 'Vampata', t: 'Fuoco', p: 90, a: 90 },
  spruzzo: { n: 'Spruzzo', t: 'Acqua', p: 45, a: 100 },
  bolle: { n: 'Raffica di Bolle', t: 'Acqua', p: 65, a: 100 },
  onda: { n: 'Ondata', t: 'Acqua', p: 90, a: 90 },
  folata: { n: 'Folata', t: 'Vento', p: 45, a: 100 },
  turbine: { n: 'Turbine', t: 'Vento', p: 65, a: 100 },
  tromba: { n: "Tromba d'Aria", t: 'Vento', p: 90, a: 85 },
  sassata: { n: 'Sassata', t: 'Roccia', p: 50, a: 90 },
  frana: { n: 'Frana', t: 'Roccia', p: 80, a: 85 },
  luce: { n: 'Luce Dorata', t: 'Normale', p: 85, a: 100 },
};

// ---------- Specie ----------
// b: [PS, Attacco, Difesa, Velocità] · cr: facilità di cattura · xp: esperienza data · ev: [evoluzione, livello]
const SP = {
  germoglino: { n: 'Germoglino', t: 'Erba', tag: 'tenace e paziente', b: [45, 49, 49, 45], cr: .45, xp: 64, ev: ['florandro', 14],
    ls: [[1, 'spintone'], [1, 'broncio'], [5, 'foglia'], [9, 'fotosintesi'], [13, 'frusta'], [18, 'tempesta']],
    d: 'Nasce da un seme caduto in primavera. Quando è contento, le foglioline sulla testa si muovono da sole.' },
  florandro: { n: 'Florandro', t: 'Erba', b: [70, 72, 70, 62], cr: .2, xp: 142,

}
function updTweens(dt) {
  for (let i = TW.length - 1; i >= 0; i--) {
    const w = TW[i]; w.t += dt; const p = Math.min(1, w.t / w.d), e = w.ease(p);

function NOTE(n) {

  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);

let mode = 'title', busy = false, steps = 0;
function setMode(m) { mode = m; document.body.dataset.mode = m; $('#hud').hidden = m !== 'world'; }
async function run(fn) {

}
const npcAt = (x, y) => NPCS.find(n => n.x === x && n.y === y);

const WORLD_H = { a() { if (canAct()) interact(); }, b() { if (canAct()) run(openMenu); }, dir() {} };
function interact() {
  const [dx, dy] = DIRV[P.dir], x = P.x + dx, y = P.y + dy;
  const n = npcAt(x, y); if (n) return run(() => talk(n));
  const ch = tileAt(x, y); if ('DSW'.includes(ch)) return run(() => tileEvent(x, y, ch));
}
let bumpT = 0;
function tryMove(d) {
  P.dir = d;
  const [dx, dy] = DIRV[d], nx = P.x + dx, ny = P.y + dy;
  if (!G.flags.starter && ny <= 33) return run(gateEvent);
  const n = npcAt(nx, ny); if (n) return run(() => talk(n));
  const ch = tileAt(nx, ny);
  if (solid(ch)) {

    return;

}
function updateWorld(dt) {
  if (mode !== 'world') return;
  if (P.moving) {
    P.mt += dt / 0.17; P.walk += dt / 0.17;
    if (P.mt >= 1) { P.mt = 1; P.moving = false; P.x = P.tx; P.y = P.ty; }
    P.fx = P.sx + (P.tx - P.sx) * P.mt; P.fy = P.sy + (P.ty - P.sy) * P.mt;
    if (!P.moving) { onStep(); }
  }
  if (!P.moving && canAct()) { const d = heldDir(); if (d) tryMove(d); }
}
function onStep() {
  G.pos = { x: P.x, y: P.y, dir: P.dir }; steps++;
  const it = ITEMS.find(i => i.x === P.x && i.y === P.y && !G.picked.includes(i.id));
  if (it) return run(() => pickItem(it));
  for (const n of NPCS) if (n.sight && n.trainer && !G.beaten[n.id] && sees(n)) return run(() => spotted(n));
  const ch = tileAt(P.x, P.y);
  if (ZONES[ch]) {
    RUSTLE = { x: P.x, y: P.y, t: NOW };
    if (G.party.some(m => m.hp > 0) && rnd() < 0.11) return run(() => wildEncounter(ch));
  }
  if (steps % 6 === 0) save();
}
function sees(n) {
  const [dx, dy] = DIRV[n.dir];
  for (let k = 1; k <= 4; k++) {
    const x = n.x + dx * k, y = n.y + dy * k;
    if (P.x === x && P.y === y) return true;
    if (solid(tileAt(x, y)) || npcAt(x, y)) return false;
  }
  return false;
}

}

const STATN = { atk: "L'Attacco", def: 'La Difesa', spd: 'La Velocità' };
function calcDamage(att, def, mv, attSide) {

function foeMove() {

    const w = m.moves.map(id => MOVES[id].p ? 3 : 1); let tot = w.reduce((a, b) => a + b, 0), r = rnd() * tot;
    for (let i = 0; i < w.length; i++) if ((r -= w[i]) < 0) return m.moves[i];
    return m.moves[0];

  for (const id of m.moves) {
    const mv = MOVES[id]; let s;
    if (mv.p) s = mv.p * eff(mv.t, SP[me().sp].t) * (mv.t === SP[m.sp].t ? 1.25 : 1) * mv.a / 100;
    else if (mv.heal) s = m.hp < maxHp(m) * 0.4 ? 90 : 0;

  if (elm._k === key) return; elm._k = key;

  elm.querySelector('.lv').textContent = 'Lv ' + m.lvl;
  const ch = elm.querySelector('.chip'); ch.textContent = SP[m.sp].t; ch.style.background = TYPES[SP[m.sp].t];
  const bar = elm.querySelector('.bar.hp > i'); bar.style.width = (r * 100).toFixed(1) + '%';
  bar.style.background = r > 0.5 ? '#46c05a' : r > 0.2 ? '#f2b631' : '#e8473f';

    if (mode === 'battle' && B) { drawBattle(NOW); updCards(); }
    else if (mode === 'evolve' && EVO) drawEvolve(NOW);
    else drawWorld(NOW);
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);
window.__petalini = { get G() { return G; }, get B() { return B; }, get mode() { return mode; }, get busy() { return busy; }, P, NPCS: () => NPCS, makeMon, battle, run, M };
