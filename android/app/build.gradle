plugins {
    id 'com.android.application'
}

android {
    namespace 'it.camminodibruno.app'
    compileSdk 34

    defaultConfig {
        applicationId 'it.camminodibruno.app'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmato con la chiave di debug: basta per installarlo a mano sul telefono.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
