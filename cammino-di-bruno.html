<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Il Cammino di Bruno</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: mappa a quadretti a tutto schermo; interfaccia a cartoncini color carta con bordo blu notte. Verde menta = latte e menta. */
:root {
  --ink: #1f2a44;
  --paper: #fffaf0;
  --paper-2: #f1ead9;
  --mint: #3fbf8f;
  --mint-soft: #dff6ec;
  --mint-deep: #23845f;
  --sun: #ffc93c;
  --sea: #2f8fd0;
  --red: #e0533a;
  --font-display: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --ui-h: 210px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #2f6b3a; color: var(--ink); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* Titolo */
#title { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); background: radial-gradient(ellipse at 50% 45%, rgba(255, 248, 225, .25), rgba(10, 30, 50, .55)); }
.title-card { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; max-width: 560px; }
.logo { margin: 0; font-family: var(--font-display); font-weight: 700; line-height: .95; display: flex; flex-direction: column; align-items: center; }
.logo .small { font-size: clamp(24px, 6vw, 36px); color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
.logo .big { font-size: clamp(64px, 17vw, 128px); color: var(--sun); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink); transform: rotate(-3deg); }
.tagline { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(17px, 4vw, 21px); color: #fff; text-shadow: 0 2px 0 var(--ink), 0 0 12px rgba(0,0,0,.4); text-wrap: balance; }
.title-btns { display: flex; flex-direction: column; gap: 10px; width: min(320px, 100%); }
.tbtn { min-height: 54px; border: 3px solid var(--ink); border-radius: 16px; background: var(--paper); font-family: var(--font-display); font-weight: 600; font-size: 20px; box-shadow: 0 5px 0 var(--ink); }
.tbtn.primary { background: var(--mint); color: #fff; }
.tbtn.focus, .tbtn:hover { outline: 3px solid var(--sun); outline-offset: 2px; }
.tbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.keys-hint { margin: 0; font-size: 14px; font-weight: 700; color: #fff; text-shadow: 0 1px 0 var(--ink); max-width: 38ch; line-height: 1.45; }

/* HUD */
#hud { position: fixed; z-index: 15; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
.hud-l { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
#goal { background: rgba(255, 250, 240, .94); border: 2.5px solid var(--ink); border-radius: 12px; padding: 6px 11px 7px; font-weight: 800; font-size: 14px; line-height: 1.25; max-width: min(64vw, 380px); box-shadow: 0 3px 0 rgba(31,42,68,.25); }
#goal small { display: block; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--mint-deep); }
.meter { white-space: nowrap; display: flex; align-items: center; gap: 8px; background: rgba(255, 250, 240, .94); border: 2.5px solid var(--ink); border-radius: 12px; padding: 5px 10px; font-weight: 800; font-size: 12px; width: fit-content; box-shadow: 0 3px 0 rgba(31,42,68,.25); }
.meter .lbl { text-transform: uppercase; letter-spacing: .08em; font-size: 10.5px; }
.ebar { width: clamp(64px, 18vw, 110px); height: 10px; border: 2px solid var(--ink); border-radius: 6px; background: #e9e0d0; overflow: hidden; }
.ebar i { display: block; height: 100%; background: var(--mint); transition: width .3s; }
.cups { font-variant-numeric: tabular-nums; }
.hud-btns { display: flex; gap: 8px; }
.hudbtn { pointer-events: auto; min-width: 46px; height: 46px; padding: 0 12px; border: 2.5px solid var(--ink); border-radius: 12px; background: var(--paper); font-family: var(--font-display); font-weight: 600; font-size: 16px; box-shadow: 0 3px 0 rgba(31,42,68,.3); }

/* Fumetto */
#dialog { position: fixed; z-index: 48; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(720px, calc(100% - 24px)); min-height: 92px; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 rgba(31,42,68,.3); padding: 16px 40px 16px 18px; font-size: clamp(16px, 2.3vw, 19px); line-height: 1.45; font-weight: 700; cursor: pointer; }
#dlgWho { position: absolute; top: -17px; left: 14px; background: var(--mint); color: #fff; border: 3px solid var(--ink); border-radius: 10px; padding: 0 10px 1px; font-family: var(--font-display); font-weight: 600; font-size: 15px; }
#dialog .more { position: absolute; right: 14px; bottom: 10px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 10px solid var(--mint-deep); opacity: 0; }
#dialog.ready .more { opacity: 1; animation: nudge .8s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(4px); } }
body.touch[data-mode="world"] #dialog { bottom: calc(184px + env(safe-area-inset-bottom, 0px)); }
body[data-mode="duel"] #dialog { left: 0; transform: none; bottom: 0; width: 100%; min-height: var(--ui-h); border-width: 3px 0 0; border-radius: 20px 20px 0 0; padding: 20px max(44px, calc(env(safe-area-inset-right, 0px) + 28px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); font-size: clamp(17px, 2.5vw, 21px); }
body.mg #dialog { left: 50%; transform: translateX(-50%); width: min(720px, calc(100% - 24px)); min-height: 80px; border-width: 3px; border-radius: 16px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 14px 40px 14px 18px; }

/* Scelte */
#choices { position: fixed; z-index: 49; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 24px)); max-height: min(80vh, 660px); overflow-y: auto; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 rgba(31,42,68,.3); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.prompt { font-family: var(--font-display); font-weight: 600; font-size: 19px; padding: 2px 4px; text-wrap: balance; }
.opts { display: grid; gap: 8px; grid-template-columns: 1fr; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 7px 12px; border: 2.5px solid var(--ink); border-radius: 12px; background: #fff; font-weight: 800; font-size: 16px; text-align: left; min-width: 0; }
.opt .txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.opt .lbl { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.15; }
.opt .sub { font-size: 13px; font-weight: 700; opacity: .72; line-height: 1.25; }
.opt.focus { background: var(--mint-soft); box-shadow: inset 0 0 0 2px var(--mint); }
.opt.disabled { opacity: .45; }
.opt.cancel { justify-content: center; background: var(--paper-2); min-height: 44px; grid-column: 1 / -1; }

/* Pannelli */
#panel { position: fixed; inset: 0; z-index: 47; display: grid; place-items: center; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); background: rgba(15, 25, 45, .5); }
.pinner { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 rgba(31,42,68,.35); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.pinner h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 26px; text-wrap: balance; }
.pinner p { margin: 0; line-height: 1.5; font-weight: 700; }
.pinner .muted { opacity: .7; font-size: 14px; }
.tappa { display: flex; align-items: center; gap: 10px; background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 6px 10px; }
.tappa .n { font-family: var(--font-display); font-weight: 600; font-size: 18px; width: 26px; text-align: center; }
.tappa .t { flex: 1; min-width: 0; font-weight: 800; font-size: 14px; line-height: 1.3; }
.tappa .t small { display: block; font-weight: 700; opacity: .7; }
.badge { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px; background: var(--paper-2); }
.badge.ok { background: var(--mint); color: #fff; }

/* Minigiochi */
#mg { position: fixed; inset: 0; z-index: 35; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); background: radial-gradient(ellipse at 50% 0%, #fff6dc, #f1e3c0); overflow-y: auto; }
.mg-head { width: min(720px, 100%); display: flex; align-items: center; gap: 10px; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; padding: 6px 10px; box-shadow: 0 4px 0 rgba(31,42,68,.25); }
.mg-head .who { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.mg-head .who.r { justify-content: flex-end; text-align: right; }
.mg-head .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mg-head .score { font-family: var(--font-display); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; padding: 0 6px; }
.mg-title { font-family: var(--font-display); font-weight: 600; font-size: 20px; text-align: center; text-wrap: balance; margin: 0; }
.mg-stage { width: min(720px, 100%); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.mg-stage canvas { width: 100%; max-width: 720px; border: 3px solid var(--ink); border-radius: 16px; background: #fff; display: block; }
.mg-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; }
.mgbtn { min-height: 56px; min-width: 84px; padding: 8px 16px; border: 3px solid var(--ink); border-radius: 16px; background: #fff; font-family: var(--font-display); font-weight: 600; font-size: 19px; box-shadow: 0 4px 0 var(--ink); }
.mgbtn.big { min-width: min(320px, 100%); min-height: 72px; font-size: 26px; background: var(--mint); color: #fff; }
.mgbtn.focus { outline: 3px solid var(--sun); outline-offset: 2px; }
.mgbtn:active, .mgbtn.on { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.mgbtn:disabled { opacity: .4; }
.mg-msg { min-height: 26px; font-weight: 800; font-size: 16px; text-align: center; text-wrap: balance; }
.board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: min(92vw, 52vh, 440px); aspect-ratio: 1; border: 3px solid var(--ink); border-radius: 8px; overflow: hidden; max-width: 100%; }
.sq { display: grid; place-items: center; font-size: min(8.4vw, 4.8vh, 40px); line-height: 1; position: relative; }
.sq.l { background: #f0dcb4; } .sq.d { background: #b58863; }
.sq.hi { box-shadow: inset 0 0 0 4px #3fbf8f; }
.pc { font-family: "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols 2", serif; }
.pc.w { color: #fff; text-shadow: 0 0 2px #000, 0 0 1px #000, 1px 1px 0 #000; }
.pc.b { color: #1a1a1a; }
.coord { position: absolute; left: 2px; bottom: 0; font-size: 9px; font-weight: 800; opacity: .55; }
.timer { width: min(520px, 100%); height: 34px; position: relative; border: 3px solid var(--ink); border-radius: 12px; background: #f6efe0; overflow: hidden; }
.timer .zone { position: absolute; top: 0; bottom: 0; background: var(--mint); }
.timer .zone.perf { background: #ffd23f; }
.timer .needle { position: absolute; top: -2px; bottom: -2px; width: 6px; margin-left: -3px; background: var(--ink); border-radius: 3px; }
.cards { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.card2 { width: min(17vw, 86px); aspect-ratio: 5 / 7; border: 2.5px solid var(--ink); border-radius: 10px; background: #fff; position: relative; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; box-shadow: 0 3px 0 rgba(31,42,68,.3); transition: transform .15s; }
.card2 .rk { position: absolute; top: 4px; left: 7px; font-size: min(5vw, 22px); }
.card2 .st { font-size: min(9vw, 40px); }
.card2.red { color: #d23a3a; }
.card2.back { background: repeating-linear-gradient(45deg, #2f8fd0 0 8px, #3fa6e6 8px 16px); }
.card2.sel { transform: translateY(-12px); }
.card2.sel::after { content: "CAMBIA"; position: absolute; bottom: -22px; font-size: 11px; letter-spacing: .06em; color: var(--red); }
.card2.focus { outline: 3px solid var(--sun); outline-offset: 2px; }
.arrows { display: grid; grid-template-columns: repeat(3, 72px); grid-template-rows: repeat(2, 64px); gap: 8px; justify-content: center; }
.arrows .mgbtn { min-width: 0; font-size: 26px; }

/* Comandi touch */
#pad { display: none; }
body.touch[data-mode="world"] #pad { display: block; }
#dpad { position: fixed; z-index: 25; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 156px; height: 156px; }
#dpad button, #ab button { position: absolute; touch-action: none; border: 3px solid var(--ink); background: rgba(255, 250, 240, .9); font-family: var(--font-display); font-weight: 700; box-shadow: 0 4px 0 rgba(31,42,68,.35); }
#dpad button { width: 54px; height: 54px; border-radius: 14px; font-size: 18px; }
#dpad .u { left: 51px; top: 0; } #dpad .d { left: 51px; bottom: 0; } #dpad .l { left: 0; top: 51px; } #dpad .r { right: 0; top: 51px; }
#dpad button.on, #ab button.on { transform: translateY(3px); box-shadow: 0 1px 0 rgba(31,42,68,.35); }
#ab { position: fixed; z-index: 25; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); width: 150px; height: 124px; }
#ab #btnA { right: 0; top: 0; width: 74px; height: 74px; border-radius: 50%; background: var(--mint); color: #fff; font-size: 26px; }
#ab #btnB { left: 0; bottom: 0; width: 60px; height: 60px; border-radius: 50%; font-size: 20px; }

#fade { position: fixed; inset: 0; z-index: 50; background: #12203a; opacity: 0; pointer-events: none; transition: opacity .3s; }
#fade.on { opacity: 1; }
#flash { position: fixed; inset: 0; z-index: 51; background: #fff; opacity: 0; pointer-events: none; }
#flash.go { animation: flash .75s steps(1) forwards; }
@keyframes flash { 0% { opacity: 1; } 14% { opacity: 0; } 28% { opacity: 1; } 42% { opacity: 0; } 56% { opacity: 1; } 70% { opacity: 0; background: #12203a; } 71% { opacity: 1; background: #12203a; } 100% { opacity: 1; background: #12203a; } }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { #dialog.ready .more { animation: none; } }
</style>
</head>
<body data-mode="title">
<canvas id="game"></canvas>

<div id="title">
  <div class="title-card">
    <h1 class="logo"><span class="small">Il Cammino di</span><span class="big">Bruno</span></h1>
    <p class="tagline">Zaino da 10 kg in spalla: da Maracalagonis a Porto Sa Ruxi, un latte e menta per ogni tappa</p>
    <div class="title-btns">
      <button class="tbtn primary" id="btnCont" hidden>Continua</button>
      <button class="tbtn" id="btnNew">Nuova partita</button>
    </div>
    <p class="keys-hint" id="keysHint">Frecce o WASD per camminare · Invio o Z per parlare e confermare · Esc o X per il menù</p>
  </div>
</div>

<div id="hud" hidden>
  <div class="hud-l">
    <div id="goal"><small id="goalTag">Tappa</small><span id="goalText"></span></div>
    <div class="meter"><span class="lbl">Energia</span><span class="ebar"><i id="ebar"></i></span><span class="cups" id="cups">0/7</span></div>
  </div>
  <div class="hud-btns">
    <button class="hudbtn" id="btnSound" aria-label="Suono">♪</button>
    <button class="hudbtn" id="btnMenu">Menu</button>
  </div>
</div>

<div id="mg" hidden></div>
<div id="dialog" hidden><span id="dlgWho" hidden></span><span id="dlgText"></span><span class="more"></span></div>
<div id="choices" hidden></div>
<div id="panel" hidden></div>

<div id="pad">
  <div id="dpad">
    <button class="u" data-d="up" aria-label="Su">▲</button>
    <button class="l" data-d="left" aria-label="Sinistra">◀</button>
    <button class="r" data-d="right" aria-label="Destra">▶</button>
    <button class="d" data-d="down" aria-label="Giù">▼</button>
  </div>
  <div id="ab">
    <button id="btnA" aria-label="A: parla e conferma">A</button>
    <button id="btnB" aria-label="B: menù e indietro">B</button>
  </div>
</div>
<div id="fade"></div>
<div id="flash"></div>

<script>
'use strict';
/* =====================================================================
   IL CAMMINO DI BRUNO
   Bruno si allena per il Cammino di Santiago: zaino da 10 kg, da
   Maracalagonis a Porto Sa Ruxi (Villasimius). In ogni tappa c'è un bar
   e davanti a ogni bar un amico che lo sfida.

   >>> Per cambiare i nomi degli amici modifica la lista AMICI qui sotto. <<<
   ===================================================================== */
const AMICI = [
  { id: 'riccio', nome: 'Il Riccio', sfida: 'scacchi',
    look: { skin: '#e2b08c', hair: '#1c1410', hairStyle: 'curly', beard: true, top: '#b8bcc4', topKind: 'tee', shorts: '#3a3c48' } },
  { id: 'canotta', nome: 'Canotta', sfida: 'braccio',
    look: { skin: '#d9a07a', hair: '#1c1410', hairStyle: 'short', beard: true, top: '#f1eee4', topKind: 'tank', shorts: '#2e3a5a' } },
  { id: 'baffo', nome: 'Il Baffo', sfida: 'cucina',
    look: { skin: '#c98d68', hair: '#1c1410', hairStyle: 'curly', mustache: true, shades: true, top: null, shorts: '#23232b' } },
  { id: 'spilungone', nome: 'Lo Spilungone', sfida: 'arrampicata',
    look: { skin: '#e6b897', hair: '#2a1d16', hairStyle: 'short', top: null, shorts: '#1c1c22', tall: true } },
  { id: 'barbuto', nome: 'Il Barbuto', sfida: 'bjj',
    look: { skin: '#d9a07a', hair: '#2a1d16', hairStyle: 'short', beard: true, top: null, shorts: '#202028', pattern: true } },
  { id: 'verde', nome: 'Verde Acqua', sfida: 'fifa',
    look: { skin: '#c98d68', hair: '#1c1410', hairStyle: 'curly', beard: true, top: null, shorts: '#2bb3a0' } },
];
const BRUNO = { nome: 'Bruno', look: { skin: '#c98d68', hair: '#1c1410', hairStyle: 'curly', beard: true, hat: true, top: '#1f3554', topKind: 'tank', shorts: '#16161c', stripes: true, necklace: true, backpack: true, smile: true } };
const SFIDE = { scacchi: 'Scacchi', braccio: 'Braccio di ferro', cucina: 'Cucina', arrampicata: 'Arrampicata', bjj: 'Brazilian jiu-jitsu', fifa: 'FIFA sulla Play', poker: 'Poker' };

// Tappe lungo il percorso reale: Maracalagonis → colline → litoranea SP17 → Porto Sa Ruxi.
const TAPPE = [
  { zona: 'Maracalagonis', bar: 'Bar della Piazza', who: 'riccio', door: [16, 12], bg: 'paese' },
  { zona: 'Colline di Maracalagonis', bar: 'Bar del Bivio', who: 'canotta', door: [25, 23], bg: 'colline' },
  { zona: 'Mari Pintau', bar: 'Chiosco Mari Pintau', who: 'baffo', door: [18, 32], bg: 'mare' },
  { zona: 'Geremeas', bar: 'Bar Geremeas', who: 'spilungone', door: [29, 32], bg: 'mare' },
  { zona: 'Torre delle Stelle', bar: 'Bar della Torre', who: 'barbuto', door: [40, 32], bg: 'mare' },
  { zona: 'Solanas', bar: 'Chiosco Solanas', who: 'verde', door: [52, 32], bg: 'mare' },
  { zona: 'Porto Sa Ruxi', bar: 'Chiosco Porto Sa Ruxi', who: 'banda', door: [64, 32], bg: 'mare' },
];
const amico = id => AMICI.find(a => a.id === id);

// ---------- Utilità ----------
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = Math.random;
const pick = a => a[Math.floor(rnd() * a.length)];
const wait = ms => new Promise(r => setTimeout(r, ms));
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }

// 7. Poker (5 carte, un cambio)
const SUITS = ['♠', '♥', '♦', '♣'], RANKN = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A' };
const HANDN = ['Carta alta', 'Coppia', 'Doppia coppia', 'Tris', 'Scala', 'Colore', 'Full', 'Poker', 'Scala colore'];
function evalHand(cs) {
  const rs = cs.map(c => c.r).sort((a, b) => b - a), cnt = {};
  for (const r of rs) cnt[r] = (cnt[r] || 0) + 1;

  else if (flush) cat = 5; else if (straightHi) cat = 4; else if (groups[0][1] === 3) cat = 3; else if (groups[0][1] === 2 && groups[1][1] === 2) cat = 2; else if (groups[0][1] === 2) cat = 1; else cat = 0;

}
function cmpHand(a, b) { if (a.cat !== b.cat) return a.cat - b.cat; for (let i = 0; i < Math.max(a.tb.length, b.tb.length); i++) { const d = (a.tb[i] || 0) - (b.tb[i] || 0); if (d) return d; } return 0; }

  const e = el('div', 'card2' + (back ? ' back' : (c.s === 1 || c.s === 2 ? ' red' : '')));
  if (!back) { e.append(el('span', 'rk', RANKN[c.r] || String(c.r)), el('span', 'st', SUITS[c.s] + '︎')); }

}
function aiKeep(hand) {

  const cnt = {}; for (const c of hand) cnt[c.r] = (cnt[c.r] || 0) + 1;
  if (ev.cat >= 1) return hand.map(c => cnt[c.r] >= 2);

$('#btnNew').addEventListener('click', async () => {
  audioInit();
  if (load()) { const i = await choose('Ricominciare da capo? Il salvataggio attuale verrà cancellato.', [{ label: 'Sì, ricomincia' }, { label: 'No' }], { cancel: false }); if (i !== 0) return; }
  G = newGame(); save(); startGame(true);
});
$('#btnCont').addEventListener('click', () => { audioInit(); G = load() || newGame(); startGame(false); });
$('#btnMenu').addEventListener('click', () => { audioInit(); if (canAct()) run(openMenu); });
$('#btnSound').addEventListener('click', () => { audioInit(); setSound(!AU.on); });
setSound(AU.on);
resize();

let last = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts; NOW += dt;
  updTweens(dt);
  if (mode === 'world') updateWorld(dt);
  if (MG && MG.update) MG.update(dt);
  try {
    if (mode === 'duel' && DUEL) drawDuel(NOW); else drawWorld(NOW);
    if (MG && MG.draw) MG.draw();
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);
window.__bruno = { get G() { return G; }, get mode() { return mode; }, get busy() { return busy; }, P, M, NPCS: () => NPCS, duel, run, MINIGAMES, zoneOf };
</script>
</body>
