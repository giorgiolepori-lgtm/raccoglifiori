<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>All'ultimo strano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
:root {
  --ink: #f3efe8; --ink-dim: #a9a39a; --bg: #0b0b0d; --panel: rgba(14, 14, 17, .86); --edge: rgba(255, 255, 255, .12);
  --hot: #ff4a1c; --hot-deep: #c3260a; --gold: #ffcf3a; --p1: #3d8bff; --p2: #ff3d5a; --hp: #f4d23c; --hp-low: #ff3b1f;
  --font-title: "Anton", "Impact", "Arial Narrow", sans-serif; --font: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; -webkit-touch-callout: none; }
canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
[hidden] { display: none !important; }
button { font-family: var(--font); color: inherit; }
.screen { position: fixed; inset: 0; z-index: 10; }
.vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }

/* --- titolo --- */
#title { display: flex; align-items: stretch; padding: calc(16px + var(--safe-t)) calc(20px + var(--safe-r)) calc(16px + var(--safe-b)) calc(20px + var(--safe-l)); background: linear-gradient(90deg, rgba(8,8,10,.92) 0%, rgba(8,8,10,.7) 38%, rgba(8,8,10,0) 70%); }
.title-col { display: flex; flex-direction: column; justify-content: center; gap: 10px; max-width: 460px; }
.logo { font-family: var(--font-title); font-size: clamp(38px, 9.5vh, 92px); line-height: .86; letter-spacing: .01em; text-transform: uppercase; margin: 0; color: var(--ink); text-shadow: 0 4px 0 #000; }
.logo span { display: block; color: var(--hot); }
.tagline { font-size: clamp(14px, 3.2vh, 20px); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin: 0 0 8px; }
.menu { display: flex; flex-direction: column; gap: 6px; }
.mbtn { appearance: none; border: 0; background: transparent; text-align: left; font-family: var(--font-title); font-size: clamp(20px, 5.6vh, 40px); text-transform: uppercase; color: var(--ink); padding: 2px 0 2px 18px; position: relative; cursor: pointer; letter-spacing: .02em; transition: color .12s, transform .12s; }
.mbtn::before { content: ""; position: absolute; left: 0; top: 50%; width: 8px; height: 60%; transform: translateY(-50%) skewX(-12deg); background: var(--hot); opacity: 0; transition: opacity .12s; }
.mbtn:hover, .mbtn:focus-visible, .mbtn.sel { color: var(--hot); transform: translateX(4px); outline: none; }
.mbtn:hover::before, .mbtn:focus-visible::before, .mbtn.sel::before { opacity: 1; }
.mbtn[disabled] { color: #5c5852; cursor: default; transform: none; }
.mbtn small { font-family: var(--font); font-size: .42em; font-weight: 700; letter-spacing: .12em; color: var(--gold); vertical-align: middle; margin-left: 8px; }
.foot { position: fixed; right: calc(16px + var(--safe-r)); bottom: calc(10px + var(--safe-b)); font-size: 13px; color: var(--ink-dim); letter-spacing: .06em; z-index: 11; }

/* --- pannelli e selezione --- */
.topbar { position: absolute; top: calc(10px + var(--safe-t)); left: calc(16px + var(--safe-l)); right: calc(16px + var(--safe-r)); display: flex; align-items: center; gap: 14px; }
.h1 { font-family: var(--font-title); font-size: clamp(22px, 6vh, 40px); text-transform: uppercase; margin: 0; letter-spacing: .02em; }
.h1 em { color: var(--hot); font-style: normal; }
.back { appearance: none; border: 2px solid var(--edge); background: var(--panel); border-radius: 999px; width: 44px; height: 44px; font-size: 22px; display: grid; place-items: center; cursor: pointer; flex: none; }
.back:active { transform: scale(.94); }
#select { background: linear-gradient(180deg, rgba(8,8,10,.75), rgba(8,8,10,0) 30%, rgba(8,8,10,0) 60%, rgba(8,8,10,.85)); }
.roster { position: absolute; left: calc(16px + var(--safe-l)); bottom: calc(14px + var(--safe-b)); display: grid; grid-template-columns: repeat(4, clamp(56px, 13vh, 92px)); gap: 6px; }
.slot { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; border: 2px solid rgba(255,255,255,.14); background: #18181c center/cover no-repeat; cursor: pointer; padding: 0; }
.slot .nm { position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 4px; font-size: clamp(11px, 2.4vh, 14px); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; background: linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,0)); text-align: left; }
.slot.locked { filter: grayscale(1) brightness(.45); cursor: default; }
.slot.locked .nm::after { content: " · presto"; font-weight: 600; color: var(--gold); text-transform: none; }
.slot.sel { border-color: var(--hot); box-shadow: 0 0 0 2px var(--hot), 0 0 18px rgba(255,74,28,.55); }
.slot.cpu { border-color: var(--p2); box-shadow: 0 0 0 2px var(--p2); }
.info { position: absolute; right: calc(16px + var(--safe-r)); bottom: calc(14px + var(--safe-b)); width: min(42vw, 360px); display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.bigname { font-family: var(--font-title); font-size: clamp(36px, 11vh, 80px); line-height: .9; text-transform: uppercase; margin: 0; text-align: right; text-shadow: 0 3px 0 #000; }
.style { text-align: right; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: clamp(13px, 2.8vh, 17px); color: var(--gold); margin: 0; }
.costume { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-weight: 700; font-size: clamp(13px, 2.8vh, 17px); }
.arrow { appearance: none; border: 2px solid var(--edge); background: var(--panel); color: var(--ink); width: 34px; height: 34px; border-radius: 999px; font-size: 16px; cursor: pointer; }
.cta { appearance: none; border: 0; border-radius: 6px; background: var(--hot); color: #fff; font-family: var(--font-title); font-size: clamp(20px, 5vh, 30px); text-transform: uppercase; padding: 8px 18px; cursor: pointer; letter-spacing: .03em; box-shadow: 0 4px 0 var(--hot-deep); }
.cta:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--hot-deep); }
.cta.ghost { background: transparent; border: 2px solid var(--edge); box-shadow: none; font-size: clamp(16px, 4vh, 22px); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { appearance: none; border: 2px solid var(--edge); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: clamp(13px, 2.8vh, 16px); text-transform: uppercase; letter-spacing: .05em; cursor: pointer; }
.chip.on { border-color: var(--hot); background: var(--hot); color: #fff; }
.lbl { text-align: right; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); margin: 4px 0 -2px; }

/* --- carte (arcade, finali) --- */
.card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(88vw, 620px); max-height: calc(100% - 40px); overflow: auto; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 18px 22px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.card h2 { font-family: var(--font-title); font-size: clamp(26px, 7vh, 44px); margin: 0 0 4px; text-transform: uppercase; line-height: 1; }
.card h2 em { color: var(--hot); font-style: normal; }
.card .kick { font-size: 13px; letter-spacing: .16em; font-weight: 800; text-transform: uppercase; color: var(--gold); margin: 0 0 6px; }
.card p { font-size: clamp(16px, 3.6vh, 21px); line-height: 1.25; margin: 6px 0 14px; font-weight: 600; }
.card .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.ladder { display: flex; gap: 6px; margin: 4px 0 12px; flex-wrap: wrap; }
.ladder span { font-weight: 800; font-size: 14px; text-transform: uppercase; padding: 3px 9px; border-radius: 4px; background: rgba(255,255,255,.08); }
.ladder span.now { background: var(--hot); }
.ladder span.done { text-decoration: line-through; color: var(--ink-dim); }

/* --- HUD --- */
#hud { pointer-events: none; z-index: 8; }
.bars { position: absolute; top: calc(8px + var(--safe-t)); left: calc(12px + var(--safe-l)); right: calc(12px + var(--safe-r)); display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: start; }
.pbar { display: flex; flex-direction: column; gap: 3px; }
.pbar.r { align-items: flex-end; }
.hp { position: relative; width: 100%; height: clamp(14px, 3.6vh, 22px); background: rgba(0,0,0,.65); border: 2px solid rgba(255,255,255,.75); transform: skewX(-14deg); overflow: hidden; }
.pbar.r .hp { transform: skewX(14deg); }
.hp .lag, .hp .cur { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; transform-origin: left center; }
.pbar.r .hp .lag, .pbar.r .hp .cur { left: auto; right: 0; transform-origin: right center; }
.hp .lag { background: #d33; }
.hp .cur { background: linear-gradient(180deg, #fff3a0, var(--hp) 45%, #d3a817); }
.hp.low .cur { background: linear-gradient(180deg, #ff9b7a, var(--hp-low) 50%, #a3200b); }
.pname { font-family: var(--font-title); font-size: clamp(16px, 4.4vh, 26px); text-transform: uppercase; line-height: 1; text-shadow: 0 2px 0 #000; display: flex; gap: 8px; align-items: center; }
.wins { display: flex; gap: 4px; }
.wins i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); background: rgba(0,0,0,.5); }
.wins i.on { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 8px var(--gold); }
.timer { font-family: var(--font-title); font-size: clamp(28px, 8vh, 48px); line-height: .9; min-width: 2.1em; text-align: center; text-shadow: 0 3px 0 #000; padding-top: 2px; }
.timer.low { color: var(--hp-low); }
.sp-ready { font-size: clamp(11px, 2.6vh, 15px); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--hot); text-shadow: 0 0 8px rgba(255,74,28,.9); animation: pulse .7s infinite alternate; }
@keyframes pulse { from { opacity: .55; } to { opacity: 1; } }
.combo { position: absolute; top: 24%; font-family: var(--font-title); font-size: clamp(26px, 7vh, 46px); text-transform: uppercase; line-height: .95; text-shadow: 0 3px 0 #000; transition: opacity .3s; }
.combo small { display: block; font-size: .45em; letter-spacing: .1em; color: var(--gold); }
.combo.l { left: calc(18px + var(--safe-l)); } .combo.r { right: calc(18px + var(--safe-r)); text-align: right; }
.banner { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-family: var(--font-title); text-transform: uppercase; pointer-events: none; }
.banner b { display: inline-block; font-weight: 400; font-size: clamp(48px, 17vh, 140px); line-height: 1; color: #fff; text-shadow: 0 6px 0 #000, 0 0 30px rgba(0,0,0,.6); animation: bannerIn .35s cubic-bezier(.2,1.6,.4,1) both; }
.banner.fight b { color: var(--hot); }
.banner.ko b { color: var(--hp-low); font-size: clamp(70px, 26vh, 220px); letter-spacing: .04em; }
@keyframes bannerIn { from { transform: scale(2.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.flash { position: absolute; font-family: var(--font-title); font-size: clamp(16px, 4vh, 26px); color: var(--gold); text-shadow: 0 2px 0 #000; top: 16%; text-transform: uppercase; }
.sub { position: absolute; left: 50%; bottom: calc(14% + var(--safe-b)); transform: translateX(-50%); max-width: min(86vw, 760px); text-align: center; }
.sub .who { display: inline-block; font-family: var(--font-title); font-size: clamp(14px, 3.8vh, 22px); text-transform: uppercase; background: var(--hot); color: #fff; padding: 1px 10px 0; letter-spacing: .04em; transform: skewX(-10deg); }
.sub .txt { margin-top: 6px; font-size: clamp(20px, 5.6vh, 36px); font-weight: 800; line-height: 1.12; text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,.8); background: rgba(0,0,0,.45); padding: 4px 14px; border-radius: 4px; }
.sub.big .txt { font-family: var(--font-title); font-weight: 400; font-size: clamp(50px, 16vh, 120px); background: none; color: var(--gold); }
.sptitle { position: absolute; left: 0; right: 0; top: 18%; text-align: center; pointer-events: none; }
.sptitle .a { font-size: clamp(14px, 3.4vh, 20px); font-weight: 800; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
.sptitle .b { font-family: var(--font-title); font-size: clamp(34px, 10vh, 76px); text-transform: uppercase; color: #fff; text-shadow: 0 4px 0 var(--hot-deep), 0 0 24px rgba(255,74,28,.7); line-height: 1; }
.spflash { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,120,40,.0) 30%, rgba(255,74,28,.55)); animation: spf .5s ease-out both; }
@keyframes spf { from { opacity: 1; } to { opacity: 0; } }
.big-fx { position: absolute; left: 0; right: 0; top: calc(6% + var(--safe-t)); text-align: center; font-family: var(--font-title); font-size: clamp(54px, 18vh, 150px); color: #fff; line-height: 1; text-shadow: 0 6px 0 #000; animation: shakeText .09s infinite; }
@keyframes shakeText { 0% { transform: translate(0,0) rotate(-2deg); } 50% { transform: translate(4px,-3px) rotate(2deg); } 100% { transform: translate(-3px,3px) rotate(-1deg); } }

/* --- comandi touch --- */
#pad { z-index: 9; }
.stick-zone { position: absolute; left: 0; top: 18%; bottom: 0; width: 46%; }
.stick { position: absolute; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%; border: 2px solid rgba(255,255,255,.28); background: rgba(0,0,0,.22); pointer-events: none; }
.knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
.btns { position: absolute; right: calc(16px + var(--safe-r)); bottom: calc(14px + var(--safe-b)); width: 214px; height: 214px; }
.btn { position: absolute; width: 84px; height: 84px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(10,10,12,.55); display: grid; place-items: center; touch-action: none; }
.btn svg { width: 40px; height: 40px; fill: #fff; opacity: .92; }
.btn .k { position: absolute; bottom: 7px; font-size: 12px; font-weight: 800; letter-spacing: .08em; opacity: .8; }
.btn.on { background: rgba(255,74,28,.75); border-color: #fff; transform: scale(.94); }
.b-lp { left: 18px; top: 0; } .b-rp { right: 0; top: 30px; } .b-lk { left: 0; bottom: 30px; } .b-rk { right: 18px; bottom: 0; }
.b-gr { position: absolute; right: calc(236px + var(--safe-r)); bottom: calc(18px + var(--safe-b)); width: 64px; height: 64px; font-size: 12px; font-weight: 800; letter-spacing: .06em; }
.b-sp { position: absolute; right: calc(236px + var(--safe-r)); bottom: calc(96px + var(--safe-b)); width: 96px; height: 96px; font-family: var(--font-title); font-size: 15px; letter-spacing: .04em; background: radial-gradient(circle, #ff7a3a, var(--hot) 55%, var(--hot-deep)); border-color: #fff; box-shadow: 0 0 22px rgba(255,74,28,.9); animation: pulse .5s infinite alternate; }
.b-pause { position: absolute; top: calc(52px + var(--safe-t)); left: 50%; transform: translateX(-50%); width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); background: rgba(0,0,0,.4); font-size: 16px; font-weight: 800; pointer-events: auto; }
#rotate { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
#rotate .ph { width: 70px; height: 110px; border: 4px solid var(--ink); border-radius: 12px; animation: rot 1.6s ease-in-out infinite; }
@keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
#rotate p { font-size: 22px; font-weight: 700; margin: 0; }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
#loading { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
#loading .logo { font-size: 46px; text-align: center; }
#loading .barl { width: 220px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
#loading .barl i { display: block; height: 100%; width: 0; background: var(--hot); transition: width .2s; }
.toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 70; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 10px 16px; font-weight: 700; font-size: 18px; }
@media (max-height: 380px) { .btns { transform: scale(.86); transform-origin: right bottom; } .b-sp, .b-gr { transform: scale(.86); transform-origin: right bottom; } }
</style>
</head>
<body>
<div id="loading"><h1 class="logo">All'ultimo <span>strano</span></h1><div class="barl"><i id="loadbar"></i></div></div>
<div class="vignette"></div>
<div id="rotate"><div class="ph"></div><p>Gira il telefono in orizzontale</p></div>
<div id="ui"></div>

<!--GAME-->
</body>
</html>
